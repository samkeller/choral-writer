services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: choral_writer
      POSTGRES_USER: choral
      POSTGRES_PASSWORD: choral
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U choral -d choral_writer"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
